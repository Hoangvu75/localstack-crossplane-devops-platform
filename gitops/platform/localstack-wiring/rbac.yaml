apiVersion: v1
kind: ServiceAccount
metadata:
  name: localstack-wiring
  namespace: localstack-wiring
---
# Cluster-scoped because Crossplane v1 managed resources are cluster-scoped, and the node
# list is too. Read-only everywhere except the two fields this job owns.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: localstack-wiring
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # lbs for the ALB dnsName that CloudFront and Route53 need; lbtargetgroups is listed
  # for symmetry although target registration goes through the AWS API, not Kubernetes.
  - apiGroups: ["elbv2.aws.upbound.io"]
    resources: ["lbs", "lbtargetgroups"]
    verbs: ["get", "list"]
  # lblisteners needs patch as well, and only lblisteners does. The job writes
  # crossplane.io/external-name onto each listener so Crossplane adopts the one that
  # already exists instead of creating another every 90 seconds -- see the long note in
  # cronjob.yaml. patch, not update: it must be able to set one annotation and nothing
  # else, and certainly not rewrite a spec that belongs to git.
  - apiGroups: ["elbv2.aws.upbound.io"]
    resources: ["lblisteners"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["aws.upbound.io"]
    resources: ["providerconfigs"]
    verbs: ["get", "list"]
  # patch, not update: the job rewrites two specific field paths and must not be able to
  # replace the whole spec of a managed resource.
  - apiGroups: ["cloudfront.aws.upbound.io"]
    resources: ["distributions"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["route53.aws.upbound.io"]
    resources: ["records"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: localstack-wiring
subjects:
  - kind: ServiceAccount
    name: localstack-wiring
    namespace: localstack-wiring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: localstack-wiring
