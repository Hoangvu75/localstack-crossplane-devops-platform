apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-wiring-script
  namespace: localstack-wiring
data:
  wire.sh: |
    #!/usr/bin/env sh
    set -eu

    PROJECT="${PROJECT_NAME}"
    ALB_MR="${PROJECT}-alb"
    TG_NAME="${PROJECT}-tg-ip"
    CF_MR="${PROJECT}-cf"
    REC_MR="${PROJECT}-record"

    echo "=== localstack-wiring $(date -u +%H:%M:%SZ) ==="

    # ── 0. Health assertion, not wiring ─────────────────────────────────────
    # The Upbound ProviderConfig CRD names its LocalStack toggles in snake_case. In
    # camelCase the API server prunes them silently, and the only visible effect is S3
    # failing much later against a virtual-hosted URL. Asserted on every loop because
    # this is the failure that looks like anything except its cause.
    #
    # The resource name is fully qualified, not the bare "providerconfig": once the
    # providers are installed, both providerconfigs and providerconfigusages match that
    # prefix and kubectl refuses with "error: you must specify only one resource". The
    # count then comes back 0 and this assertion fires against a ProviderConfig that is
    # completely correct.
    TOGGLES=$(kubectl get providerconfigs.aws.upbound.io default -o json 2>/dev/null | grep -c 'skip_[a-z_]*": true' || true)
    if [ "${TOGGLES:-0}" -lt 4 ]; then
      echo "WARNING: providerconfig/default has ${TOGGLES:-0} skip_ toggles, expected 4."
      echo "         They were pruned by the API server. Check for camelCase field names"
      echo "         in gitops/infrastructure/provider/provider-config.yaml."
    fi

    # ── 1. ALB target group membership, one per console ─────────────────────
    # Three load balancers, three NodePorts. Each pair is a CONTRACT between a target
    # group in gitops/infrastructure/loadbalancer/ and a Service nodePort:
    #
    #   -tg-ip     :30080  ingress-nginx, the public application
    #   -argocd-tg :30081  argocd-server-nodeport
    #   -tekton-tg :30082  tekton-dashboard-nodeport
    #   -signoz-tg :30083  signoz-nodeport
    #
    # k3d gives the node a new container IP on every cluster recreation, which is why
    # none of this can be written down as a manifest.
    NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || echo "")
    if [ -z "${NODE_IP}" ]; then
      echo "WARNING: could not read the node InternalIP, skipping target registration"
    else
      for PAIR in "${PROJECT}-tg-ip:30080" "${PROJECT}-argocd-tg:30081" "${PROJECT}-tekton-tg:30082" "${PROJECT}-signoz-tg:30083"; do
        TG_N="${PAIR%%:*}"
        TG_P="${PAIR##*:}"
        TG_ARN=$(aws elbv2 describe-target-groups --names "${TG_N}" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
        if [ -z "${TG_ARN}" ] || [ "${TG_ARN}" = "None" ]; then
          echo "target group ${TG_N} does not exist yet, Crossplane still reconciling"
          continue
        fi
        CURRENT=$(aws elbv2 describe-target-health --target-group-arn "${TG_ARN}" --query 'TargetHealthDescriptions[].Target.Id' --output text 2>/dev/null || echo "")
        # Compared before writing so a converged cluster makes no write calls.
        # Re-registering is harmless, but it makes the log useless for spotting the
        # moment a node IP actually changed.
        if echo " ${CURRENT} " | grep -Fq " ${NODE_IP} "; then
          echo "${TG_N}: ${NODE_IP}:${TG_P} already registered"
        else
          aws elbv2 register-targets --target-group-arn "${TG_ARN}" --targets "Id=${NODE_IP},Port=${TG_P}"
          echo "${TG_N}: registered ${NODE_IP}:${TG_P} (previous: ${CURRENT:-none})"
        fi
      done
    fi

    # ── 2. CloudFront origin and Route53 alias ──────────────────────────────
    ALB_DNS=$(kubectl get lbs.v1beta1.elbv2.aws.upbound.io "${ALB_MR}" -o jsonpath='{.status.atProvider.dnsName}' 2>/dev/null || echo "")

    if [ -z "${ALB_DNS}" ]; then
      echo "ALB reports no dnsName in .status.atProvider yet, nothing to wire"
      echo "=== done ==="
      exit 0
    fi

    # LocalStack does not always report a canonical hosted zone id. The real us-east-1
    # value is the correct fallback and is inert locally either way.
    ALB_ZONE=$(kubectl get lbs.v1beta1.elbv2.aws.upbound.io "${ALB_MR}" -o jsonpath='{.status.atProvider.zoneId}' 2>/dev/null || echo "")
    ALB_ZONE="${ALB_ZONE:-Z35SXDOTRQ7X7K}"

    CUR_ORIGIN=$(kubectl get distributions.v1beta1.cloudfront.aws.upbound.io "${CF_MR}" -o jsonpath='{.spec.forProvider.origin[0].domainName}' 2>/dev/null || echo "")
    if [ "${CUR_ORIGIN}" = "${ALB_DNS}" ]; then
      echo "cloudfront origin already ${ALB_DNS}"
    else
      # ── The API version here is load-bearing ────────────────────────────
      # `kubectl patch distribution.cloudfront.aws.upbound.io` resolves to the PREFERRED
      # version, which is v1beta2, while these manifests are written against v1beta1. The
      # two are not shape-compatible: Upbound converted singleton lists to objects in
      # v1beta2, so origin[].customOriginConfig is an array in v1beta1 and an object in
      # v1beta2. The patch below is v1beta1-shaped and was rejected every two minutes:
      #
      #     spec.forProvider.origin[0].customOriginConfig: Invalid value: "array":
      #       ... in body must be of type object: "array"
      #
      # Nothing else showed it. The Distribution stayed SYNCED=True READY=True with its
      # origin still on the placeholder, so CloudFront existed and served nothing useful.
      # Route53 Record.alias has the same v1beta1/v1beta2 split.
      #
      # Pinning the version, distributions.v1beta1.cloudfront.aws.upbound.io, is what makes
      # kubectl validate against the same schema the manifest uses. Migrating the manifests
      # to v1beta2 instead would also work, and means rewriting every nested list as an
      # object.
      # A merge patch replaces a list wholesale, so the whole origin entry is restated.
      # httpPort stays 4566: LocalStack binds nothing on 80 and multiplexes every
      # emulated endpoint behind its gateway port.
      #
      # printf builds the JSON so the patch body carries no escaped quotes. Inline
      # escaping inside a YAML block scalar inside a ConfigMap is three levels of quoting
      # and gets corrupted by the first tool that reformats the file.
      ORIGIN_PATCH=$(printf '{"spec":{"forProvider":{"origin":[{"domainName":"%s","originId":"alb-origin","customOriginConfig":[{"httpPort":4566,"httpsPort":443,"originProtocolPolicy":"http-only","originSslProtocols":["TLSv1.2"]}]}]}}}' "${ALB_DNS}")
      kubectl patch distributions.v1beta1.cloudfront.aws.upbound.io "${CF_MR}" --type=merge -p "${ORIGIN_PATCH}"
      echo "patched cloudfront origin: ${CUR_ORIGIN:-unset} -> ${ALB_DNS}"
    fi

    CUR_ALIAS=$(kubectl get records.v1beta1.route53.aws.upbound.io "${REC_MR}" -o jsonpath='{.spec.forProvider.alias[0].name}' 2>/dev/null || echo "")
    if [ "${CUR_ALIAS}" = "${ALB_DNS}" ]; then
      echo "route53 alias already ${ALB_DNS}"
    else
      ALIAS_PATCH=$(printf '{"spec":{"forProvider":{"alias":[{"evaluateTargetHealth":false,"name":"%s","zoneId":"%s"}]}}}' "${ALB_DNS}" "${ALB_ZONE}")
      kubectl patch records.v1beta1.route53.aws.upbound.io "${REC_MR}" --type=merge -p "${ALIAS_PATCH}"
      echo "patched route53 alias: ${CUR_ALIAS:-unset} -> ${ALB_DNS}"
    fi

    # Printed every loop so `make status`, which tails this log, always has the current
    # entry URLs without querying anything itself.
    CF_DOMAIN=$(kubectl get distributions.v1beta1.cloudfront.aws.upbound.io "${CF_MR}" -o jsonpath='{.status.atProvider.domainName}' 2>/dev/null || echo "")
    echo "ENDPOINT App        http://${ALB_DNS}:4566/"
    for PAIR in "argocd-alb:ArgoCD" "tekton-alb:Tekton" "signoz-alb:SigNoz"; do
      LB_N="${PROJECT}-${PAIR%%:*}"
      LB_LABEL="${PAIR##*:}"
      D=$(aws elbv2 describe-load-balancers --names "${LB_N}" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
      if [ -n "${D}" ] && [ "${D}" != "None" ]; then
        echo "ENDPOINT ${LB_LABEL}     http://${D}:4566/"
      fi
    done
    if [ -n "${CF_DOMAIN}" ]; then
      echo "ENDPOINT CloudFront http://${CF_DOMAIN}:4566/"
    fi
    echo "ENDPOINT Webhook    http://${ALB_DNS}:4566/tekton-webhook  (POST only)"
    echo "=== done ==="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: localstack-wiring
  namespace: localstack-wiring
  labels:
    app: localstack-wiring
spec:
  # Two minutes is a compromise: fast enough that a cluster recreation heals before you
  # finish reading `make status`, slow enough that the log stays readable. Every write is
  # compared first, so a converged run costs four read-only API calls and nothing else.
  schedule: "*/2 * * * *"
  # Forbid, not Replace: a run still going is in the middle of an AWS write, and killing
  # it mid-patch is worse than skipping a cycle.
  concurrencyPolicy: Forbid
  # Keep the last success, which is what `make status` reads, and two failures.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  # Without this a cluster suspended overnight wakes up and runs every missed schedule.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      # The next schedule is two minutes away, so a stuck pod should die rather than block
      # the CronJob under concurrencyPolicy: Forbid.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: localstack-wiring
        spec:
          serviceAccountName: localstack-wiring
          restartPolicy: Never
          containers:
            - name: wire
              # The same image the Tekton git task uses: carries kubectl and the AWS CLI,
              # so nothing is installed at runtime.
              image: alpine/k8s:1.28.2
              command: ["/bin/sh", "/opt/wiring/wire.sh"]
              env:
                - name: PROJECT_NAME
                  value: learn-crossplane
                # In-cluster address. The host uses http://localhost:4566; this pod runs on
                # the k3d network where the compose service name resolves.
                - name: AWS_ENDPOINT_URL
                  value: http://localstack:4566
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                # Deliberately literal, not a Secret. LocalStack accepts any credential and
                # these are worthless anywhere else, so a Secret would imply a protection
                # that does not exist. On real AWS this becomes IRSA and both lines
                # disappear — README §7.
                - name: AWS_ACCESS_KEY_ID
                  value: mock_access_key
                - name: AWS_SECRET_ACCESS_KEY
                  value: mock_secret_key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/wiring
                # readOnlyRootFilesystem is set, and the AWS CLI writes here.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: localstack-wiring-script
            - name: tmp
              emptyDir: {}
