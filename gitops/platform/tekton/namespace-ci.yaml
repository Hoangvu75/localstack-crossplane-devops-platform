# Pipelines run HERE, not in tekton-pipelines.
#
# ── Why the split is not optional ───────────────────────────────────────────
# Tekton v1.x ships its own namespace carrying
#     pod-security.kubernetes.io/enforce: restricted
# and PodSecurity rejects every TaskRun pod created there. Not just the privileged DinD
# build step -- even a plain `git clone` is refused, because the init containers Tekton
# injects into every TaskRun do not satisfy the profile:
#
#     pods "...-fetch-repository-pod" is forbidden: violates PodSecurity
#     "restricted:latest": allowPrivilegeEscalation != false (containers "prepare",
#     "place-scripts", "working-dir-initializer", "step-clone" ...), runAsNonRoot != true,
#     seccompProfile ...
#
# Relabelling tekton-pipelines would be the wrong fix twice over: it weakens the namespace
# the controllers live in, and ArgoCD would revert it on the next sync because the label
# comes from the upstream release manifest.
#
# Separating them is also the layout Tekton recommends on its own: tekton-pipelines is the
# control plane, your pipelines belong in a namespace you own.
#
# ── Why `privileged` and not `baseline` ─────────────────────────────────────
# The build step runs a Docker daemon in a pod (securityContext.privileged: true), which
# baseline forbids as well. This is a local lab building images with DinD; a production
# setup would use a rootless builder (kaniko, buildkit, or Tekton's own image tooling) and
# could then run under baseline or restricted. See README §7.
apiVersion: v1
kind: Namespace
metadata:
  name: tekton-ci
  labels:
    pod-security.kubernetes.io/enforce: privileged
    # warn/audit are left at restricted on purpose: the pods still get flagged in the audit
    # log, so the exemption stays visible instead of becoming invisible policy.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
