apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Why the upstream releases are vendored instead of fetched by URL ─────────
# These four files used to be listed as remote `resources:` URLs pointing at
# storage.googleapis.com. Two reasons that had to change, and the second is specific to
# this lab:
#
#   Reproducible  every other component in this repo vendors its upstream manifest
#                 (install-v2.13.2.yaml, controller-v1.11.3.yaml, signoz-v0.139.0.yaml).
#                 A remote base makes `kustomize build` a network call from the ArgoCD
#                 repo-server on every single reconcile.
#   DNS           LocalStack is the DNS server for containers it creates, including the
#                 k3d nodes this cluster runs on, and it answers for domains it decides
#                 are AWS-shaped. docker-compose.yml carries an explicit
#                 DNS_NAME_PATTERNS_TO_RESOLVE_UPSTREAM allowlist for exactly this reason
#                 — and storage.googleapis.com was never on it.
#
# Refresh procedure (do NOT hand-edit these files):
#   curl -sSL -o pipeline-v0.56.0.yaml \
#     https://storage.googleapis.com/tekton-releases/pipeline/previous/v0.56.0/release.yaml
#   ... and likewise for triggers, interceptors, dashboard.
#
# ── Why there is no `namespace:` transformer ─────────────────────────────────
# There used to be `namespace: tekton-pipelines` here. The pipeline release does not live
# in one namespace: 100 of its resources are in tekton-pipelines and 16 are in
# tekton-pipelines-resolvers. A blanket transformer silently relocated those 16 into
# tekton-pipelines, leaving the remote-resolution controller reading config from a
# namespace it no longer occupied.
#
# The upstream manifests already declare correct namespaces, and every local file below
# sets `namespace: tekton-pipelines` explicitly on its own resources.
# ── Why these versions and not the ones this repo started with ──────────────
# It was pipeline v0.56.0 / triggers v0.27.0 / dashboard v0.45.0, and none of them can be
# installed any more. Those releases publish their images to gcr.io, and Google has
# migrated gcr.io onto Artifact Registry, where the tekton-releases project no longer
# serves anonymous pulls:
#
#     Unauthenticated requests do not have permission
#     artifactregistry.repositories.downloadArtifacts on resource
#     projects/tekton-releases/locations/us/repositories/gcr.io
#
# Inside the cluster that surfaced only as a 403 on the token endpoint, which looks like
# a LocalStack DNS problem and is not one -- `docker pull` of the same image from the
# Docker host, nowhere near LocalStack, fails identically.
#
# Tekton has since moved to ghcr.io, which is already on the
# DNS_NAME_PATTERNS_TO_RESOLVE_UPSTREAM allowlist in docker-compose.yml. All three
# components below were checked with `docker manifest inspect` before being pinned.
#
# tekton.dev/v1beta1 is still served for Task/Pipeline/TaskRun/PipelineRun in pipeline
# v1.x, so nothing under ci/ had to change. Prefer tekton.dev/v1 for anything new.
#
# The dashboard number is not a typo: v0.63.1 is what the release bucket actually serves
# as latest, even though GitHub tags v0.71.0.
resources:
  - pipeline-v1.6.0.yaml
  - triggers-v0.34.0.yaml
  - triggers-interceptors-v0.34.0.yaml
  - dashboard-v0.63.1.yaml
  - namespace-ci.yaml
  - rbac.yaml
  - ingress.yaml
  - nodeport-svc.yaml
  - ci/task-git-clone.yaml
  - ci/task-build-and-push.yaml
  - ci/task-git-update-workloads.yaml
  - ci/pipeline.yaml
  - ci/triggers.yaml
