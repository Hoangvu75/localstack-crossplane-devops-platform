apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-update-workloads
  namespace: tekton-pipelines
spec:
  description: Rewrites the Kustomize image tags for all six services and pushes the commit back to git.
  workspaces:
    - name: source
  params:
    - name: registryHost
      type: string
      default: "000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566"
    - name: projectName
      type: string
      default: "learn-crossplane"
    - name: gitUserEmail
      type: string
      default: "tekton-ci@localstack-crossplane.internal"
    - name: gitUserName
      type: string
      default: "Tekton CI"
    - name: gitBranch
      type: string
      default: "main"
  steps:
    - name: update-and-push
      image: alpine/k8s:1.28.2
      workingDir: $(workspaces.source.path)
      env:
        # ── The gap that made this whole pipeline a no-op ────────────────────
        # This secret is created by step 5 of scripts/bootstrap.sh, which reads the token
        # out of AWS Secrets Manager (where step 00 put it) and materialises it here.
        #
        # Before that step existed, nothing in the repo created `git-credentials` — the
        # string appeared exactly once, on this line. Combined with `optional: true` and
        # the old `if [ -n "$GITHUB_TOKEN" ]` guard, the task printed "Skipping git push"
        # and exited 0. Result: images were built and pushed to ECR, the PipelineRun went
        # green, and ArgoCD never saw a new tag. CI and CD were never actually connected,
        # and nothing anywhere said so.
        #
        # `optional: true` is kept deliberately: a missing secret should produce the
        # explicit error below, not a pod stuck in CreateContainerConfigError.
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: git-credentials
              key: token
              optional: true
      script: |
        #!/usr/bin/env sh
        set -eu

        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "ERROR: secret 'git-credentials' (key: token) is missing or empty in" >&2
          echo "       namespace tekton-pipelines. Without it this task cannot push the" >&2
          echo "       updated image tags, and ArgoCD will keep deploying the old ones." >&2
          echo "" >&2
          echo "       Create it with:  make secrets && make bootstrap" >&2
          echo "       (it reads \$PROJECT_NAME/github-token from Secrets Manager)" >&2
          exit 1
        fi

        COMMIT_SHA=$(cat commit_sha.txt)
        COMMIT_TAG=$(echo "${COMMIT_SHA}" | cut -c 1-7)
        echo "=== [Tekton CI] Updating GitOps workloads to ${COMMIT_TAG} ==="

        SERVICES="web:web-app cpu-service:cpu-service memory-service:memory-service disk-service:disk-service rest-service:rest-service history-service:history-service"

        for item in $SERVICES; do
          APP_DIR="${item%%:*}"
          REPO_SUFFIX="${item##*:}"
          REPO_NAME="$(params.projectName)-${REPO_SUFFIX}"
          FULL_IMAGE="$(params.registryHost)/${REPO_NAME}:${COMMIT_TAG}"
          WORKLOAD_DIR="gitops/workloads/${APP_DIR}"

          if [ ! -d "${WORKLOAD_DIR}" ]; then
            echo "ERROR: ${WORKLOAD_DIR} does not exist — the SERVICES map is out of sync" >&2
            echo "       with gitops/workloads/." >&2
            exit 1
          fi

          echo ">>> ${WORKLOAD_DIR}/kustomization.yaml -> ${COMMIT_TAG}"
          # The key on the left must match the `images[].name` already in that
          # kustomization.yaml, which in turn must match the bare `image:` in its
          # deployment.yaml. All three are the ECR repository name.
          ( cd "${WORKLOAD_DIR}" && kustomize edit set image "${REPO_NAME}=${FULL_IMAGE}" )
        done

        echo ">>> Committing..."
        git config user.email "$(params.gitUserEmail)"
        git config user.name "$(params.gitUserName)"

        # ── Why a credential helper and not a token in the URL ──────────────
        # The previous version built https://${GITHUB_TOKEN}@github.com/... with sed and
        # handed it to `git push`. git echoes the remote URL in several of its error
        # messages, so any push failure printed the PAT into the PipelineRun log, where the
        # Tekton Dashboard renders it to anyone who can open the page. A credential helper
        # keeps the token off the command line and out of git's output.
        git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'

        git add gitops/workloads/
        if git diff-index --quiet HEAD --; then
          echo ">>> No image tag changed. Nothing to commit."
          exit 0
        fi

        # `[skip ci]` is not folklore here — the CEL filter in ci/triggers.yaml reads it
        # and refuses to start a run. Removing this marker reintroduces an infinite CI
        # loop: this push fires the webhook, which builds, which pushes again.
        git commit -q -m "chore(ci): update image tags to ${COMMIT_TAG} [skip ci]"

        echo ">>> Pushing to $(params.gitBranch)..."
        # HEAD:<branch> because the clone may be a detached checkout of a SHA rather than
        # a branch. A non-fast-forward here means someone pushed while the build ran; that
        # is a real conflict and should fail loudly rather than be force-pushed away.
        if ! git push origin "HEAD:$(params.gitBranch)"; then
          echo "ERROR: push rejected. Most likely $(params.gitBranch) moved while this" >&2
          echo "       build was running. Re-run the pipeline against the new head." >&2
          exit 1
        fi
        echo ">>> Pushed. ArgoCD will pick up the new tags on its next poll."
