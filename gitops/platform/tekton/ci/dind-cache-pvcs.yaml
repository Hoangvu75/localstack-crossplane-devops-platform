# One Docker layer cache per application, instead of one shared cache for all six.
#
# ── Why per-app and not one big PVC ─────────────────────────────────────────
# The build is six parallel Tasks now, and each runs its own Docker daemon. Two dockerd
# processes must never share one /var/lib/docker -- it corrupts the data dir -- so a single
# ReadWriteOnce claim would force the builds back into a queue.
#
# Splitting also makes the cache useful in the way that matters day to day. Change only
# apps/web and the other five Tasks hit their own cache and finish in seconds, because
# Docker's cache key for their layers has not moved. With one shared cache the six builds
# also evicted each other's layers.
#
# 15Gi each is a ceiling, not an allocation: local-path provisions a directory on the node
# and consumes only what is written.
#
# The claim name is derived from the app directory in
# ci/task-build-and-push.yaml (claimName: dind-cache-$(params.appDir)), so adding a service
# means adding a PVC here with a matching name and nothing else.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-web
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-cpu-service
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-memory-service
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-disk-service
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Java is the outlier: the Maven repository alone is several GB.
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-rest-service
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache-history-service
  namespace: tekton-ci
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 15Gi
