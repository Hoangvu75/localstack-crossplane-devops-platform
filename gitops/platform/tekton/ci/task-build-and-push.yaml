apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-and-push
  namespace: tekton-ci
spec:
  description: Builds ONE microservice image and pushes it to the LocalStack ECR registry.
  workspaces:
    - name: source
  params:
    - name: appDir
      type: string
      description: Directory under apps/, and the suffix of this app's dind cache PVC.
    - name: repoSuffix
      type: string
      description: >-
        ECR repository suffix. Equal to appDir for every service except web, which
        publishes to <project>-web-app.
    - name: registryHost
      type: string
      default: "000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566"
    - name: projectName
      type: string
      default: "learn-crossplane"
  results:
    - name: image
      description: The fully qualified image reference that was pushed.
  steps:
    - name: build-and-push
      image: docker:24.0.7-dind
      securityContext:
        privileged: true
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - name: dind-storage
          mountPath: /var/lib/docker
      env:
        # ── The single most important line in this file ──────────────────────
        # The registry host is 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud.
        # LocalStack serves a certificate for *.localhost.localstack.cloud, and a TLS
        # wildcard matches exactly ONE label, so it does not cover a four-label subdomain.
        # Docker tries HTTPS first, fails verification, and will not fall back to plaintext
        # on its own:
        #     x509: certificate is valid for *.localhost.localstack.cloud, not
        #     000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud
        #
        # The k3d nodes do not hit this because LocalStack configures their containerd with
        # the registry marked insecure when it creates the cluster. A Docker daemon started
        # by hand inside a pod gets none of that, so it has to be told here.
        - name: DOCKER_INSECURE_REGISTRY
          value: "$(params.registryHost)"
      # ── Why these numbers, and what they actually control ──────────────────
      # Six of these Tasks run in parallel, and the memory REQUEST is the throttle. The node
      # has ~15.5Gi allocatable with ~3.2Gi already requested by everything else, so at 3Gi
      # apiece roughly four builds are admitted at once and the rest stay Pending until
      # capacity frees. That is deliberate: Tekton has no maxConcurrency, and Kubernetes
      # resource requests are the native way to bound it.
      #
      # Without a request they would all schedule immediately -- the node reports only 20%
      # of memory as requested while actually using 71%, because most containers here
      # declare nothing -- and six simultaneous cold builds would exhaust RAM.
      #
      # The limit is higher than the request on purpose: a build that briefly needs more
      # should get it, and a runaway one should be OOM-killed rather than taking the node
      # down with it.
      resources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "4"
          memory: 5Gi
      script: |
        #!/usr/bin/env sh
        set -eu

        APP_DIR="$(params.appDir)"
        REPO_NAME="$(params.projectName)-$(params.repoSuffix)"

        # ── --mtu is why this build takes minutes instead of an hour ─────────
        # dockerd defaults its bridge to MTU 1500 and hands 1500 to every build container.
        # But this pod sits behind flannel VXLAN, whose 50 bytes of encapsulation leave the
        # pod eth0 at 1450. Anything between 1451 and 1500 bytes is silently dropped, and
        # path MTU discovery does not survive four levels of nesting (build container ->
        # docker0 -> pod eth0 -> cni0 -> k3d node -> Docker Desktop).
        #
        # Measured symptom, and it is deceptive: DNS answered in 0s because queries are
        # small UDP, while an HTTPS GET to registry.npmjs.org timed out at 20s because the
        # TLS handshake and every bulk transfer need full-size frames. npm then crawled --
        # `npm ci` for apps/web took 47 MINUTES and finally tripped
        #     npm error Exit handler never called!
        # exiting 0 with an empty node_modules. Nothing in that chain says MTU.
        #
        # Read from the pod interface rather than hardcoded, so a change in the CNI or its
        # overhead does not silently reintroduce the same stall.
        POD_MTU=$(cat /sys/class/net/eth0/mtu 2>/dev/null || echo 1450)
        echo ">>> [${APP_DIR}] starting Docker daemon (insecure: ${DOCKER_INSECURE_REGISTRY}, mtu: ${POD_MTU})"
        dockerd-entrypoint.sh --insecure-registry "${DOCKER_INSECURE_REGISTRY}" --mtu="${POD_MTU}" >/tmp/dockerd.log 2>&1 &

        # Bounded wait. An unbounded `until docker info` turns a daemon that failed to start
        # into a Task that hangs until the timeout with no diagnostic.
        i=0
        until docker info >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -gt 60 ]; then
            echo "ERROR: [${APP_DIR}] docker daemon did not come up in 60s. Daemon log:" >&2
            tail -50 /tmp/dockerd.log >&2
            exit 1
          fi
          sleep 1
        done

        COMMIT_SHA=$(cat commit_sha.txt)
        COMMIT_TAG=$(echo "${COMMIT_SHA}" | cut -c 1-7)
        FULL_IMAGE="$(params.registryHost)/${REPO_NAME}:${COMMIT_TAG}"

        echo ">>> [${APP_DIR}] building ${FULL_IMAGE}"

        # LocalStack's ECR accepts anonymous pushes, so this login is not what makes the
        # push work today -- it is what stops this Task from being the thing that breaks
        # when the registry becomes real. Non-fatal on purpose: `aws` is absent from the
        # dind image and adding it would double the image pull.
        if command -v aws >/dev/null 2>&1; then
          aws ecr get-login-password --region us-east-1 --endpoint-url http://localstack:4566 \
            | docker login --username AWS --password-stdin "$(params.registryHost)" || true
        fi

        # ── No `|| true` anywhere below ─────────────────────────────────────
        # This used to end in `docker push ... || echo "Pushed or simulated push"`, which
        # turned any push failure into a green Task. The pipeline then reported success,
        # git-update-workloads wrote image tags for images that did not exist, ArgoCD synced
        # them, and the pods went ImagePullBackOff -- three steps away from the real error.
        docker build -t "${FULL_IMAGE}" "apps/${APP_DIR}"
        docker push "${FULL_IMAGE}"

        echo ">>> OK: ${FULL_IMAGE}"
        printf '%s' "${FULL_IMAGE}" > "$(results.image.path)"
  volumes:
    - name: dind-storage
      # Per-app cache. Two dockerd processes must never share one /var/lib/docker, and
      # these Tasks run in parallel, so a single shared claim would serialise them and let
      # the six builds evict each other's layers. See ci/dind-cache-pvcs.yaml.
      persistentVolumeClaim:
        claimName: dind-cache-$(params.appDir)
