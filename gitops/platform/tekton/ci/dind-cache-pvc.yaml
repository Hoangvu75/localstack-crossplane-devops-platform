# Persistent layer cache for the in-pod Docker daemon.
#
# ── Why this is the highest-value change to the build ───────────────────────
# /var/lib/docker was an emptyDir, so every run started from an empty cache: re-pull every
# base image, re-extract every layer, and re-run `npm ci` from scratch. Measured on this
# host, that npm ci took 47 MINUTES for apps/web alone, and the task hit its 110-minute
# ceiling before finishing six images.
#
# With the cache on a PVC, the layers survive between runs. Docker's cache key for
#     COPY package*.json ./
#     RUN npm ci ...
# only changes when package-lock.json changes, so the second run onwards skips the
# expensive install entirely and rebuilds just the layers after the source COPY.
#
# The disk is the same physical device either way -- this buys persistence, not speed.
#
# ── The caveat, which is real ──────────────────────────────────────────────
# ReadWriteOnce, and two dockerd processes must never share one /var/lib/docker: it
# corrupts the data dir. Tekton has no concurrencyPolicy like CronJob, so two overlapping
# PipelineRuns would both mount this and both start a daemon. In a lab where runs are
# manual or webhook-driven and rare, that is an acceptable trade for turning an
# hour-and-a-half build into a few minutes. If concurrent builds ever matter, the answer is
# not a bigger PVC -- it is dropping DinD for a rootless builder (kaniko, buildkit), which
# also lets the whole thing run under PodSecurity restricted instead of privileged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-cache
  namespace: tekton-ci
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Six images with their build stages. node_modules and the Maven repository dominate.
      storage: 40Gi
