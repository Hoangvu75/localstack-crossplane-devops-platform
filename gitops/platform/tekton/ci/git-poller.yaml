# ── Why a poller exists when a perfectly good EventListener is already running ──
#
# ci/triggers.yaml declares the whole webhook path: a TriggerBinding, a TriggerTemplate,
# and an EventListener with a github interceptor and a CEL filter. All of it is healthy.
# None of it had ever been reached:
#
#     service/el-ci-webhook-listener   ClusterIP   10.43.214.65   <none>   8080/TCP
#
# ClusterIP, no external address. That endpoint exists only inside the cluster, and for
# GitHub to POST to it a connection would have to arrive from the public internet through
#
#     GitHub -> home IP -> NAT router -> Windows -> WSL2 -> Docker Desktop -> k3d -> 10.43.x
#
# Nothing on that path forwards inbound. The EventListener log confirmed it: zero events
# in nineteen hours of uptime. This is NOT a Tekton limitation, and it is not fixed by
# swapping the CI engine -- CodeBuild would sit behind exactly the same NAT. It is a
# reachability problem, one layer below the tool.
#
# So invert the direction. A CronJob inside the cluster only ever makes OUTBOUND calls,
# which NAT does not obstruct, and it reaches the EventListener over the cluster DNS name
# that GitHub cannot. ArgoCD in this same cluster has been doing precisely this all along:
# it detects git changes by polling every 180s, and has never received a webhook either.
#
# ── Why it POSTs a synthetic push event instead of creating a PipelineRun ──────
#
# Creating a PipelineRun directly would need its own RBAC, and would duplicate the CI
# policy that ci/triggers.yaml already owns: the refs/heads/main check, and the
# `[skip ci]` filter that is the only thing standing between this repo and an infinite
# build loop (the pipeline's last task pushes a commit, which would trigger the next
# build, forever). Duplicated policy drifts. Posting the event keeps ONE source of truth
# and inherits every future change to that filter for free.
#
# The trade against a real webhook is honest and small: latency is up to one poll
# interval instead of instant, and the payload carries the four fields the binding and
# filter actually read, not GitHub's full push event.
#
# To move to real webhooks later, put a tunnel (cloudflared/ngrok) in front of the
# EventListener, uncomment secretRef in ci/triggers.yaml -- an internet-exposed listener
# with no signature check will build whatever anyone POSTs to it -- and delete this file.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-git-poller-state
  namespace: tekton-ci
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # One 40-byte SHA. The floor is the provisioner's, not this workload's.
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-git-poller
  namespace: tekton-ci
spec:
  # 2 minutes: below ArgoCD's 180s reconcile, so CI is never the slow half of the loop.
  schedule: "*/2 * * * *"
  # Forbid, not Allow: a poll that hangs on a slow git must not stack up behind itself.
  concurrencyPolicy: Forbid
  # Without this, a cluster that was asleep wakes up and fires every missed schedule.
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A poll is seconds of work. Anything past two minutes is stuck, not slow.
      activeDeadlineSeconds: 120
      # 0 retries: the next tick is 2 minutes away and is a cleaner retry than a backoff
      # loop inside a Job whose whole purpose is to run again shortly.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            # All four set together on purpose. runAsGroup WITHOUT runAsUser is what put
            # the web deployment into permanent ContainerCreating with
            # "failed to generate user string" -- see gitops/workloads/web/deployment.yaml.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Makes the local-path volume group-writable, which is the only reason uid
            # 1000 can record last_sha on a PVC the provisioner created as root.
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poll
              # Already pulled on this node by ci/task-git-clone.yaml, so this adds no
              # image pull. It ships BusyBox wget, which has --post-data and --header --
              # there is no curl in this image and none is needed.
              image: alpine/git:v2.43.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              env:
                - name: REPO_URL
                  value: "https://github.com/Hoangvu75/localstack-crossplane-devops-platform.git"
                - name: BRANCH
                  value: "main"
                - name: EVENT_LISTENER
                  value: "http://el-ci-webhook-listener.tekton-ci.svc.cluster.local:8080"
                # HOME must be writable for `git config --global`, and / is read-only here.
                - name: HOME
                  value: /tmp
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: git-credentials
                      key: token
                      optional: true
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STATE=/state/last_sha

                  # A credential helper rather than https://TOKEN@github.com/... in the
                  # URL: the URL form leaks the token into every error message and into
                  # `git remote -v`. Same reasoning as ci/task-git-clone.yaml.
                  git config --global credential.helper \
                    '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'

                  REMOTE_SHA=$(git ls-remote "$REPO_URL" "refs/heads/$BRANCH" | cut -f1)
                  if [ -z "$REMOTE_SHA" ]; then
                    echo "ERROR: no refs/heads/$BRANCH at $REPO_URL" >&2
                    exit 1
                  fi

                  LAST_SHA=$(cat "$STATE" 2>/dev/null || echo "")
                  if [ "$REMOTE_SHA" = "$LAST_SHA" ]; then
                    echo "no change: $REMOTE_SHA"
                    exit 0
                  fi
                  echo "new head: ${LAST_SHA:-<none>} -> $REMOTE_SHA"

                  # The commit MESSAGE is required, not optional: the CEL filter reads
                  # body.head_commit.message to enforce [skip ci], and ls-remote returns
                  # only hashes. --depth 1 of a single commit on a 2.9MB repo is cheap.
                  WORK=$(mktemp -d)
                  cd "$WORK"
                  git init -q .
                  git remote add origin "$REPO_URL"
                  git fetch -q --depth 1 origin "$REMOTE_SHA"
                  MSG=$(git log -1 --pretty=%B FETCH_HEAD)
                  echo "subject: $(printf '%s' "$MSG" | head -1)"

                  # Hand-rolled JSON escaping because there is no jq in this image.
                  #
                  # Order matters: backslashes first, or the escape added for a quote is
                  # itself escaped a step later and the JSON breaks.
                  #
                  # tr, not `sed 's/\t/\\t/g'`, for the tab: this image runs BusyBox sed,
                  # which does not understand \t in a pattern and would leave a raw tab
                  # inside a JSON string -- invalid, and rejected by strict parsers. A tab
                  # in a commit subject carries no meaning to a CI filter, so folding it
                  # to a space is a better trade than a fragile escape. \r goes for the
                  # same reason: it would otherwise land raw in the payload.
                  #
                  # The awk step turns real newlines into the two characters \ and n; the
                  # final sed drops the trailing one awk always appends.
                  ESC=$(printf '%s' "$MSG" \
                    | tr '\t' ' ' \
                    | tr -d '\r' \
                    | sed 's/\\/\\\\/g' \
                    | sed 's/"/\\"/g' \
                    | awk '{ printf "%s\\n", $0 }' \
                    | sed 's/\\n$//')

                  # Exactly the four fields ci/triggers.yaml reads: .ref and
                  # .head_commit.message for the CEL filter, .repository.clone_url and
                  # .head_commit.id for the TriggerBinding.
                  PAYLOAD="{\"ref\":\"refs/heads/$BRANCH\",\"repository\":{\"clone_url\":\"$REPO_URL\"},\"head_commit\":{\"id\":\"$REMOTE_SHA\",\"message\":\"$ESC\"}}"

                  echo ">>> POST $EVENT_LISTENER"
                  wget -q -O- \
                    --header='Content-Type: application/json' \
                    --header='X-GitHub-Event: push' \
                    --post-data="$PAYLOAD" \
                    "$EVENT_LISTENER"
                  echo ""

                  # Only after a 2xx. Recording a SHA whose POST failed would skip that
                  # commit forever.
                  #
                  # Recorded even when the CEL filter REJECTS the event, which is correct:
                  # the pipeline's own "[skip ci]" commit is a real new head that must be
                  # marked seen, or every tick re-posts it for the rest of time.
                  printf '%s' "$REMOTE_SHA" > "$STATE"
                  echo "recorded $REMOTE_SHA"
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: ci-git-poller-state
            # readOnlyRootFilesystem is on, and both git and mktemp need somewhere to write.
            - name: tmp
              emptyDir: {}
