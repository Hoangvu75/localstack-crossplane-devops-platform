apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: monorepo-ci-pipeline
  namespace: tekton-ci
spec:
  description: >-
    Clones the repo once, builds the six microservice images in parallel, then writes the
    new image tags back to git.
  workspaces:
    - name: shared-data
  params:
    - name: repoUrl
      type: string
      default: "https://github.com/Hoangvu75/localstack-crossplane-devops-platform.git"
    - name: gitRevision
      type: string
      default: "main"
    - name: registryHost
      type: string
      default: "000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566"
    - name: projectName
      type: string
      default: "learn-crossplane"
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.repoUrl)
        - name: revision
          value: $(params.gitRevision)

    # ── Six independent builds, not one loop over six services ────────────────
    # This was a single monorepo-build-and-push Task that iterated over all six in one
    # container. Three things were wrong with that:
    #
    #   Serial      every service waited for the one before it, so a change to one line in
    #               apps/web still paid for a Java build and two Python builds.
    #   All or
    #   nothing     one failing service produced one red Task, and the log had to be read
    #               to find out which. Now the failing service is named on the Tekton
    #               graph, and the other five still show green.
    #   One cache   a single shared /var/lib/docker meant the six builds evicted each
    #               other's layers. Each Task now has its own PVC, so an unchanged service
    #               hits its cache and finishes in seconds.
    #
    # They all declare `runAfter: [fetch-repository]` and nothing else, which is what makes
    # Tekton run them concurrently. How many actually run at once is decided by the memory
    # REQUEST on the Task, not here -- see the note in ci/task-build-and-push.yaml.
    #
    # appDir is the directory under apps/ AND the suffix of the cache PVC.
    # repoSuffix is the ECR repository name after the project prefix. The two differ for
    # exactly one service: apps/web publishes to learn-crossplane-web-app.
    - name: build-web
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "web" }
        - { name: repoSuffix, value: "web-app" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    - name: build-cpu-service
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "cpu-service" }
        - { name: repoSuffix, value: "cpu-service" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    - name: build-memory-service
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "memory-service" }
        - { name: repoSuffix, value: "memory-service" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    - name: build-disk-service
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "disk-service" }
        - { name: repoSuffix, value: "disk-service" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    - name: build-rest-service
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "rest-service" }
        - { name: repoSuffix, value: "rest-service" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    - name: build-history-service
      taskRef: { name: build-and-push }
      runAfter: [fetch-repository]
      workspaces: [{ name: source, workspace: shared-data }]
      params:
        - { name: appDir, value: "history-service" }
        - { name: repoSuffix, value: "history-service" }
        - { name: registryHost, value: $(params.registryHost) }
        - { name: projectName, value: $(params.projectName) }

    # ── Deliberately all-or-nothing ──────────────────────────────────────────
    # runAfter lists all six, so a single failed build skips this Task and no tags are
    # written. That is the safe default: writing a tag for an image that was never pushed
    # is how you get ImagePullBackOff in production with a green pipeline behind it.
    #
    # The cost is that five good builds do not deploy when the sixth fails. Making this
    # per-service would mean six git commits racing each other on one branch, which is a
    # worse problem than waiting for a fix.
    - name: update-gitops-manifests
      taskRef:
        name: git-update-workloads
      runAfter:
        - build-web
        - build-cpu-service
        - build-memory-service
        - build-disk-service
        - build-rest-service
        - build-history-service
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: registryHost
          value: $(params.registryHost)
        - name: projectName
          value: $(params.projectName)
