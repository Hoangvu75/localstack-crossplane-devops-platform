# Three ports, three different consumers, and they do not belong on one Service.
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ── Why the agent port is a separate Service ─────────────────────────────────
# Agents connect back over JNLP on 50000, and jenkinsTunnel in casc.yaml names THIS
# Service. Keeping it apart from the UI Service means the NodePort and the ALB in front of
# the UI never expose the agent protocol, which authenticates with a per-agent secret and
# has no business being reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: jenkins-agent
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
  ports:
    - name: agent
      port: 50000
      targetPort: agent
---
# ── nodePort 30082 is a CONTRACT, inherited from Tekton ──────────────────────
# gitops/infrastructure/loadbalancer/alb-jenkins.yaml points a target group at this port,
# and gitops/platform/localstack-wiring/cronjob.yaml registers the node into it. Change
# the number here and the ALB goes to a port nothing serves, with the only symptom being
# an unhealthy target.
#
# 30080/30081/30083 are taken by ingress-nginx, argocd-server and signoz. Jenkins takes
# the slot the Tekton Dashboard held, so the ALB, the target group and the verify script
# keep the same shape.
#
# Jenkins gets its own ALB rather than a path on the application ALB for the reason the
# Tekton Dashboard did: it serves its UI and assets from /, and the host-less / on the
# application ALB belongs to the web app.
apiVersion: v1
kind: Service
metadata:
  name: jenkins-nodeport
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
