# Kustomization for cpu-service alone. One environment, one directory — no base/overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# REQUIRED: without it resources get no namespace and ClusterRoleBindings point at the wrong one.
namespace: devops-apps

resources:
- deployment.yaml
- service.yaml
- rbac.yaml

# includeSelectors is off: label only, never touch the Deployment selector (changing a
# selector forces a delete and recreate).
#
labels:
- pairs:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: cpu-service
    app.kubernetes.io/part-of: learn-crossplane

# ── Where CI hands over to CD ────────────────────────────────────────────────
# The Tekton task `git-update-workloads` runs `kustomize edit set image` in THIS directory
# and commits the result. One file per service, so two parallel builds never clobber each
# other. Replaced CodeBuild, which could not self-trigger on a push. See README §8.1.
images:
- name: learn-crossplane-cpu-service
  newName: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/learn-crossplane-cpu-service
  newTag: 270237c
