apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  # `replicas` is deliberately absent: the HorizontalPodAutoscaler owns it. Declaring it here
  # would make every ArgoCD sync fight the autoscaler back to a fixed number.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # never drop below the current replica count during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      annotations:
        # ── Without this the entire frontend is invisible in SigNoz ───────────
        # Every other Node/Python/Java service carries this annotation; web did not, so
        # the OTel operator injected no agent and the Next.js app produced no spans at
        # all. The pod is healthy, the log is clean, and the service simply never appears
        # on the trace list -- exactly the silent failure README section 9.3 warns about,
        # arriving by a different route.
        #
        # rest-service is the one service that legitimately has no annotation: Go has no
        # runtime agent, so it is instrumented in code in apps/rest-service/telemetry.go.
        #
        # The sibling learn-opensible lab is missing this line too.
        instrumentation.opentelemetry.io/inject-nodejs: "true"
      labels:
        app: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # ── runAsUser and fsGroup were MISSING, and the pod could not start ────
        # With runAsGroup set and runAsUser absent, containerd refuses to build the user
        # string and the sandbox never comes up:
        #
        #     Failed to create pod sandbox: ... failed to generate user string:
        #     user group "1000" is specified without user
        #
        # It presents as ContainerCreating forever, with no image-pull error and no
        # container to get logs from, so it reads like a slow pull. The two comments here
        # were left orphaned above seccompProfile, which is what gave the intent away.
        #
        # 1000:1000 is the `node` user that ships in node:20-alpine, matching USER node in
        # apps/web/Dockerfile. fsGroup is what lets kubelet chown the emptyDirs mounted
        # below, which readOnlyRootFilesystem makes mandatory.
        #
        # The sibling learn-opensible lab carries the identical defect in this same file.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so losing one node cannot take the app down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          # Bare image name: no registry, no tag. The Kustomize images block supplies both — that is
          # what CI writes and what ArgoCD notices.
          image: learn-crossplane-web-app
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # startupProbe absorbs the slow start so liveness need not be loosened permanently.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # readOnlyRootFilesystem means every writable path must be mounted explicitly.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
