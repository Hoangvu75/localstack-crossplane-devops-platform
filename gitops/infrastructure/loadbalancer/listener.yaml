apiVersion: elbv2.aws.upbound.io/v1beta1
kind: LBListener
metadata:
  name: learn-crossplane-alb-listener
spec:
  forProvider:
    defaultAction:
      - targetGroupArnSelector:
          matchLabels:
            component: alb
        type: forward
    loadBalancerArnSelector:
      matchLabels:
        component: alb
    port: 80
    protocol: HTTP
    region: us-east-1
    tags:
      Name: learn-crossplane-listener
      Environment: dev
