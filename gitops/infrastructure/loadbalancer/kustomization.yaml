apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Three load balancers, one per audience, matching the sibling learn-opensible lab:
#
#   alb.yaml         :30080  the public application, via ingress-nginx
#   alb-argocd.yaml  :30081  the GitOps console
#   alb-signoz.yaml  :30083  the observability console
#
# Each carries its own `component:` label, and every Ref/Selector in this directory keys
# off that label. Reusing one label across two load balancers would make the listener
# selectors ambiguous, and Crossplane resolves the FIRST match rather than failing, so the
# symptom would be a listener quietly attached to the wrong ALB.
resources:
  - alb.yaml
  - target-group.yaml
  - listener.yaml
  - alb-argocd.yaml
  - alb-signoz.yaml
