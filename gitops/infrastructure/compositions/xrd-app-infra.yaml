apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappinfras.devops.platform.io
spec:
  group: devops.platform.io
  names:
    kind: XAppInfra
    plural: xappinfras
  claimNames:
    kind: AppInfra
    plural: appinfras
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                environment:
                  type: string
                  default: dev
                  enum:
                    - dev
                    - staging
                    - prod
                region:
                  type: string
                  default: us-east-1
              required:
                - environment
            status:
              type: object
              properties:
                bucketName:
                  type: string
                ecrRepositoryUrl:
                  type: string
