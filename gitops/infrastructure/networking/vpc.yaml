kind: VPC
metadata:
  name: learn-crossplane-vpc
  labels:
    environment: dev
spec:
  forProvider:
    cidrBlock: 10.0.0.0/16
    enableDnsHostnames: true
    enableDnsSupport: true
    region: us-east-1
    tags:
      Name: learn-crossplane-vpc
      Environment: dev
