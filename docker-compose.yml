# ── This lab and learn-opensible are MUTUALLY EXCLUSIVE ─────────────────────
# Both declare container_name: localstack and both publish 4566 plus 4510-4559. Only one
# can run at a time, and Docker refuses the second with a name conflict rather than a port
# error, which points at the wrong thing:
#     Conflict. The container name "/localstack" is already in use
#
# Switching labs, from the OTHER project directory:
#     docker compose down          # or: docker rm localstack
#
# That removes the container only. Each lab keeps its own emulated AWS state in its own
# ./data/localstack bind mount, so switching back loses nothing.
#
# An explicit project name keeps `docker compose ps` readable and matches the sibling lab,
# which uses learn-opensible.
name: learn-crossplane

services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"  # external services port range (EKS API, ECR, etc.)
    environment:
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_PAT:-}
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Retain emulated resources across restarts, saved to ./data/localstack volume.
      - PERSISTENCE=1
      # ── Without this, the EKS cluster never starts on this machine ───────
      # LocalStack defaults K3S_IMAGE_TAG to 1.36, which resolves to
      # rancher/k3s:v1.36.2-k3s1. That k3s dropped cgroup v1 support, and the Docker
      # Desktop WSL2 VM here presents cgroup v1. The kubelet refuses to start:
      #
      #     Error: failed to validate kubelet configuration, error: kubelet is
      #     configured to not run on a host using cgroup v1
      #     Shutdown request received: "kubelet exited: ..."
      #
      # k3s exits about three seconds in. What you actually SEE is none of that: the
      # k3d containers stay Up (the serverlb is a separate nginx container and is
      # perfectly healthy), LocalStack polls readiness for 150 seconds, and then
      #
      #     Waiter ClusterActive failed: ... we matched expected path: "FAILED"
      #     ERROR ... Error starting K3D cluster: Timeout while waiting for EKS startup
      #
      # which reads like a slow machine. The real error is only in
      #     docker logs k3d-<cluster>-server-0
      #
      # v1.31.14-k3s1 is the last line that still supports cgroup v1, and it is what
      # the sibling learn-opensible lab runs on this same host.
      #
      # The alternative fix is host-wide rather than project-local: give WSL2 a cgroup
      # v2 hierarchy by putting this in %UserProfile%\.wslconfig
      #     [wsl2]
      #     kernelCommandLine = cgroup_no_v1=all
      # then `wsl --shutdown` and restart Docker Desktop. That unpins the k3s version
      # but changes cgroup behaviour for every container on the machine, so it is a
      # decision about the workstation, not about this lab.
      - K3S_IMAGE_TAG=v1.31.14-k3s1
      # Disable CSRF mitigation to allow frontend web apps to load static assets seamlessly
      - DISABLE_CORS_CHECKS=1
      # Force external CDN/Registry domains to resolve via real upstream DNS to avoid x509 cert issues
      - DNS_NAME_PATTERNS_TO_RESOLVE_UPSTREAM=.*cloudfront\.net,.*gcr\.io,.*storage\.googleapis\.com,.*\.pkg\.dev,.*registry\.k8s\.io,.*quay\.io,.*ghcr\.io,.*docker\.io,.*docker\.com,.*githubusercontent\.com,.*github\.com,.*\.azureedge\.net,.*blob\.core\.windows\.net
    env_file:
      - .env
    volumes:
      - ./data/localstack:/var/lib/localstack
      - //var/run/docker.sock:/var/run/docker.sock

  # Optional local devops-tools runner container equipped with awscli, kubectl, helm
  devops-runner:
    image: alpine/k8s:1.28.2
    container_name: devops-runner
    restart: "no"
    profiles: ["tools"]
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=mock_access_key
      - AWS_SECRET_ACCESS_KEY=mock_secret_key
    volumes:
      - ./:/workspace
      - //var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    depends_on:
      - localstack
